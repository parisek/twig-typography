name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Give the input string, the locale and the config you pass.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package, PHP, Twig and Symfony YAML versions.
      placeholder: "twig-typography 1.4.0, PHP 8.4, Twig 3.27, Symfony YAML 7.3"
    validations:
      required: true

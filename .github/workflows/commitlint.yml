name: Lint PR Title

# Enforces Conventional Commits on the PR title. Repo settings only allow
# squash-merge (allow_merge_commit / allow_rebase_merge are both disabled)
# with squash_merge_commit_title: PR_TITLE, so the PR title is *mechanically*
# the commit subject that lands on `main` — not just a habit. Same-repo PRs
# only, so plain `pull_request` (no secrets) is enough; no untrusted code is
# checked out.
#
# Only the PR title is linted, never past commits: `git log` already carries
# non-conventional subjects from before this rule existed (e.g. "Beta",
# "README typo", "Release 1.2.3"), and a history-wide check would fail on
# every PR forever. Checking the title also matches the squash-merge model —
# the title is the only subject that survives onto `main`.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types — mirrors what `git log` actually shows in this
          # repo's history (feat/fix/docs/chore/ci/test/refactor + the
          # project's own `qa` type for aggregate code-quality commits, e.g.
          # de78795, 65959e2). Deliberately narrower than the Angular preset:
          # no perf/build/revert/style — add one only once a real commit
          # needs it.
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            qa
          # Scope is optional and freeform in this repo's history
          # (fix(typography), fix(languages), fix(ci), fix(test) alongside
          # plenty of scopeless commits) — no fixed scope enum.
          requireScope: false
